  <script>
    // Font Awesome 本地字体加载失败时回退到 CDN（Windows http.server 默认无 woff2 MIME 时触发）
    (function () {
      var cdn = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css';
      function loadCDN() {
        if (document.getElementById('fa-cdn')) return;
        var l = document.createElement('link');
        l.id = 'fa-cdn';
        l.rel = 'stylesheet';
        l.href = cdn;
        document.head.appendChild(l);
      }
      function check() {
        if (!document.fonts) { loadCDN(); return; }
        document.fonts.ready.then(function () {
          var ok = document.fonts.check('900 16px "Font Awesome 6 Free"') ||
                   document.fonts.check('400 16px "Font Awesome 6 Free"');
          if (!ok) loadCDN();
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', check);
      } else {
        check();
      }
    })();
  </script>

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      var _isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
      if (!_isNative) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').then(function (reg) {
            if (!reg) return;
            // 发版后没有更新提示 → 用户会长期停在旧页面（SW 是 cache-first 的）。
            // 这里监听新 SW 就绪并给一条可点击的提示条，点一下即刷新到新版。
            function onNewWorker(sw) {
              if (!sw) return;
              sw.addEventListener('statechange', function () {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                  window.dispatchEvent(new CustomEvent('sw-updated'));
                }
              });
            }
            if (reg.waiting) onNewWorker(reg.waiting);
            reg.addEventListener('updatefound', function () { onNewWorker(reg.installing); });
          }).catch(function(){});
        });
      }
    }

<!-- ================= 开屏保险丝 =================
     开屏遮罩 z-index 9999 全屏覆盖。正常由 app.js setupSplash() 移除，
     但一旦 app.js 因任何原因没跑起来（老 WebView 语法解析失败、启动即崩），
     这层透明遮罩会永久挡住所有触摸 —— 表现为「导航点不动」。
     这段内联脚本独立于任何外部 JS，3.5s 后强制拆掉遮罩兜底。 -->
<script>
  setTimeout(function () {
    try {
      var sp = document.getElementById('app-splash');
      if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
    } catch (e) {}
  }, 3500);
</script>
